spring:
  application:
    name: AIService


  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.use.type.headers: false
        spring.json.type.mapping: com.fitness.ActivityService.Entity.Activity:com.fitness.aiService.Model.Activity
        spring.json.value.default.type: com.fitness.aiService.Model.Activity
        spring.json.trusted.packages: "*"
      group-id: activity-processor-group


kafka:
  topic:
    name: activity-events


  data:
    mongodb:
      uri: mongodb://localhost:27017/airecommendationdatabase
      database: airecommendationdatabase

eureka:
  client:
    service-url:
      defaultzone: http://localhost:8761/eureka/